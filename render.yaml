services:
  - type: web
    name: ms-webhook-api
    runtime: python
    buildCommand: pip install -r requirements.txt && alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false          # set this in the Render dashboard
      - key: REDIS_URL
        sync: false          # set this in the Render dashboard
      - key: PYTHON_VERSION
        value: 3.11.0
